# separate terms of service, privacy policy, and support
# documentation.

# CI workflow for validating Jekyll build (deployment is handled by Netlify)
name: Jekyll CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Purge unused CSS
        run: |
          npx --yes purgecss \
            --css _site/assets/plugins/bootstrap/css/bootstrap.min.css \
            --content '_site/**/*.html' \
            --output _site/assets/plugins/bootstrap/css/
          npx purgecss \
            --css _site/assets/fontawesome/css/all.min.css \
            --content '_site/**/*.html' \
            --safelist pattern:/^fa/ \
            --output _site/assets/fontawesome/css/
      - name: Verify generated site
        run: test -f _site/index.html
