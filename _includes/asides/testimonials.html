{% assign testimonials = site.testimonials | where: 'status', 'published' %}
{% if testimonials.size > 0 %}
<aside class="testimonials aside section">
    <div class="section-inner shadow-sm rounded">
        <h2 class="heading">Testimonials</h2>
        <div class="content">
            {% for testimonial in testimonials %}
            <div class="item">
                <blockquote class="quote">
                    <p><i class="fas fa-quote-left"></i>{{ testimonial.content }}</p>
                </blockquote>
                <p class="source"><span class="name">{{ testimonial.name }}</span><br /><span class="title">{{ testimonial.company }}</span></p>
            </div>
            {% endfor %}
            <p><a class="more-link" href="#"><i class="fas fa-external-link-alt"></i>More on Linkedin</a></p>
        </div>
    </div>
</aside>
{% endif %}
